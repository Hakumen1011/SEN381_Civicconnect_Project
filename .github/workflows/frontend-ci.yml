
name: Frontend CI

on:
  pull_request:
    paths:
      - 'Milestone 3/CivicConnect_Project_working/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Milestone 3/CivicConnect_Project_working/frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Milestone 3/CivicConnect_Project_working/frontend'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'Milestone 3/CivicConnect_Project_working/frontend/package-lock.json'
      - name: Install packages
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Type check and build
        run: npm run build